# ============================================================================
# AI tools declaration
# ============================================================================

ai_tools_used:
  - "Claude"

ai_usage_summary: |
  Used Claude for architectural discussion, code review, and debugging.
  All candidate data was processed locally. No candidate data was fed
  to any external LLM or API. The ranking system runs fully offline
  with no network calls during inference.

# ============================================================================
# Approach summary
# ============================================================================

methodology_summary: |
  Multi-signal linear ranker combining TF-IDF semantic similarity with
  rule-based career signal extraction. Six weighted signals: semantic job
  match (35%), systems built score (25%), production ML score (15%),
  product company boost (10%), behavioral signals (10%), experience depth
  (5%). Hard caps applied for honeypots, domain mismatches, and
  location-ineligible candidates. Behavioral scoring uses Redrob recency,
  response rate, open-to-work flag, and notice period. Full pipeline runs
  in 35 seconds on CPU for 100K candidates with no network calls.

